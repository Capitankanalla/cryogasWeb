<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryoGas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <span data-key="tagline"></span>
    <div class="top-contact">
      <a href="#" id="link-phone" data-key="contacto_rapido.telefono"></a>
      <a href="#" id="link-email" data-key="contacto_rapido.email"></a>
    </div>
  </div>

  <!-- Header & Nav -->
  <header class="main-header">
    <div class="logo">
      <img src="img/logo_gran_II-removebg.png" alt="CryoGas Logo">
    </div>
    <nav>
      <ul>
        <li><a href="#inicio" data-key="navegacion.inicio"></a></li>
        <li><a href="#empresa" data-key="navegacion.empresa"></a></li>
        <li><a href="#industrial" data-key="navegacion.industrial"></a></li>
        <li><a href="#criobiologia" data-key="navegacion.criobiologia"></a></li>
        <li><a href="#blog" data-key="navegacion.blog"></a></li>
        <li><a href="#contacto" data-key="navegacion.contacto"></a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 data-key="hero.titulo"></h1>
      <p data-key="hero.descripcion"></p>
    </div>
  </section>

  <!-- Estadístiques -->
  <section class="stats-container">
    <div class="stat-card">
      <h2 data-key="estadisticas.experiencia.valor"></h2>
      <p data-key="estadisticas.experiencia.etiqueta"></p>
    </div>
    <div class="stat-card">
      <h2 data-key="estadisticas.proyectos.valor"></h2>
      <p data-key="estadisticas.proyectos.etiqueta"></p>
    </div>
    <div class="stat-card">
      <h2 data-key="estadisticas.servicio.valor"></h2>
      <p data-key="estadisticas.servicio.etiqueta"></p>
    </div>
  </section>

  <!-- Serveis -->
  <section class="services">
    <h3 data-key="servicios.titulo_seccion"></h3>
    <h2 data-key="servicios.destacado_titulo"></h2>
    <p data-key="servicios.p1"></p>
    <p data-key="servicios.p2"></p>
    <p data-key="servicios.p3"></p>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
